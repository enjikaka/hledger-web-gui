name: Tester

on:
  push:
    branches: ["main"]
  pull_request:
  # Går att köra manuellt från Actions-fliken
  workflow_dispatch:

# En körning per gren räcker — pushar man igen är den förra inte intressant
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typkontroll och tester
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Sätt upp Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      # Rapportörerna väljs i vitest.config.ts utifrån GITHUB_ACTIONS:
      # annoteringar och jobbsammanfattning i CI, ren utskrift lokalt.
      - name: Kör tester
        run: npm test

      - name: Spara testrapporten
        # Körs även när testerna faller — det är då rapporten behövs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testresultat
          path: test-results.xml
          retention-days: 30
          if-no-files-found: warn
